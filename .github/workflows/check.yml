name: Check Instatic TalksX

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check:x-oauth
      - run: npm run test:x-oauth
      - run: npm run check:x-publish
      - run: npm run test:x-publish
      - run: npm run check:x-schedule
      - run: npm run test:x-schedule
      - run: npm test
      - run: npm run test:db
      - run: npm run test:db:oauth
      - run: npm run test:db:x-publish
      - run: npm run test:db:x-schedule
      - run: npm run build:github-pages
      - run: test -f dist/client/index.html
